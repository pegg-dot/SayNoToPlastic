name: Admin UX Verification

on:
  push:
    branches:
      - feat/admin-airbnb-ux-v40-51
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release audit
        run: npm run release:audit

      - name: Syntax audit
        run: npm run syntax:audit

      - name: Production build
        run: npm run build
