name: Production Recovery Probe

on:
  push:
    branches:
      - fix/production-recovery-v40-52
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: "8bf346eaf76025be25b6e17703f0ae75"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check Cloudflare deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No Cloudflare API token secret is configured in this repository."
            exit 78
          fi
          npx wrangler whoami
