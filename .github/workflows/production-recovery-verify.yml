name: Production Recovery Verification

on:
  push:
    branches:
      - fix/production-recovery-v40-52
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run release:audit
      - run: npm run syntax:audit
      - run: npm run build
