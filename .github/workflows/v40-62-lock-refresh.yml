name: v40.62 lockfile security refresh

on:
  push:
    branches: [v40.62-newsletter-nav]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: v40.62-newsletter-nav
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm

      - name: Refresh patched production dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "v40.62 refresh patched transitive dependencies"
          git push origin HEAD:v40.62-newsletter-nav
